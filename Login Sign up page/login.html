<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Page</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container">
        <form>
            <h1>LOGIN</h1>
            <div class="user">
                <svg height="15px" width="15px" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg"
                    xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 60.671 60.671" xml:space="preserve"
                    fill="#000000">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <g>
                            <g>
                                <ellipse style="fill:rgb(44, 118, 147);" cx="30.336" cy="12.097" rx="11.997"
                                    ry="12.097"></ellipse>
                                <path style="fill:rgb(44, 118, 147);"
                                    d="M35.64,30.079H25.031c-7.021,0-12.714,5.739-12.714,12.821v17.771h36.037V42.9 C48.354,35.818,42.661,30.079,35.64,30.079z">
                                </path>
                            </g>
                        </g>
                    </g>
                </svg>
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="pass">
                <svg width="15px" height="15px" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M4 6V4C4 1.79086 5.79086 0 8 0C10.2091 0 12 1.79086 12 4V6H14V16H2V6H4ZM6 4C6 2.89543 6.89543 2 8 2C9.10457 2 10 2.89543 10 4V6H6V4ZM7 13V9H9V13H7Z"
                            fill="rgb(44, 118, 147)"></path>
                    </g>
                </svg>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="check">
                <input type="checkbox" id="checkbox" onclick="showPass()"> 
                <span> Show Password </span>
                <input type="checkbox" id="checkbox">
                <span>Remember Me?</span>
            </div>
            <div class="btn">
                <input type="submit" value="Login" id="sub" onclick="mysql.php">
            </div>
            <p>Don't have account? <a href="sign-up page.html">Sign Up</a></p>
        </form>
    </div>
    <script>
        function showPass() {
            let x = document.getElementById("password");
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password"; 
            }
        }
    </script>
</body>

</html>
